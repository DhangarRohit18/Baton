<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BATON Knowledge Capture</title>
  <style>
    :root {
      --bg-navy: #0B132B;
      --card-navy: #1C2541;
      --accent-teal: #06B6D4;
      --accent-hover: #0891B2;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: #334155;
      --danger: #EF4444;
      --success: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 360px;
      background: var(--bg-navy);
      color: var(--text-main);
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent-teal);
    }
    .badge {
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid var(--accent-teal);
      color: var(--accent-teal);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select, textarea {
      width: 100%;
      background: var(--card-navy);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-teal);
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn-primary {
      background: var(--accent-teal);
      color: #04101E;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: var(--card-navy);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      margin-top: 6px;
    }
    .preview-box {
      background: var(--card-navy);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .preview-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .preview-url {
      color: var(--text-muted);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-msg {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }
    .status-success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
      color: #A7F3D0;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #FECACA;
    }
    .footer-link {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
    }
    .footer-link a {
      color: var(--accent-teal);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
      BATON
    </div>
    <span class="badge">V3 Guarded</span>
  </div>

  <div id="auth-section" style="display: none;">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="user@company.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" id="btn-login">Sign In to BATON</button>
  </div>

  <div id="capture-section">
    <div class="preview-box">
      <div class="preview-title" id="page-title">Detecting active page...</div>
      <div class="preview-url" id="page-url">...</div>
    </div>

    <div class="form-group">
      <label>Target Project</label>
      <select id="project-select">
        <option value="">Loading projects...</option>
      </select>
    </div>

    <div class="form-group">
      <label>Tags (Comma separated)</label>
      <input type="text" id="capture-tags" placeholder="architecture, ops, runbook">
    </div>

    <div class="form-group">
      <label>Context Notes / Rationale</label>
      <textarea id="capture-notes" rows="2" placeholder="Why this knowledge matters for successors..."></textarea>
    </div>

    <button class="btn btn-primary" id="btn-capture-all">Capture Full Page</button>
    <button class="btn btn-secondary" id="btn-capture-selection">Capture Selected Highlight</button>
  </div>

  <div class="status-msg" id="status-box"></div>

  <div class="footer-link">
    <a href="http://localhost:5173" target="_blank" id="open-dashboard-link">Open BATON Web Platform &rarr;</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
