services:
  - type: web
    name: baton-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baton-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: baton-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  - type: worker
    name: baton-worker
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baton-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: baton-redis
          property: connectionString

  - type: redis
    name: baton-redis
    plan: free
    ipAllowList: []

databases:
  - name: baton-db
    plan: free

